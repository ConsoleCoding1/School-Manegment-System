<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="all.min.css">
    <style>
        .inputError {
            border-color: red;
        }
    </style>
</head>

<body class="">
    <div class="justify-center flex items-center h-screen">
        <form action="" method="post" class="w-96 border border-gray-400" id="loginForm">
            <div class="bg-blue-800 px-5 py-5">
                <h1 class="text-xl font-semibold text-white">User Authentication</h1>
            </div>
            <div class="px-2 py-2">

                <div class="text-center">
                    <input type="text" id="email" name="email"
                        class="border-b py-3 px-5 w-full text-lg rounded-t border-gray-400 focus:outline-none focus:ring-0 bg-gray-200/50"
                        placeholder="Enter Your Email*">
                </div>
                <br>
                <div class="text-center">
                    <input type="password" id="password" name="Password"
                        class="border-b py-3 px-5 w-full text-lg rounded-t border-gray-400 focus:outline-none focus:ring-0 bg-gray-200/50"
                        placeholder="Enter Your Password*">
                </div>
                <br>
                <button id="submitBtn" type="submit" class="cursor-pointer bg-[#ff4081]/90 w-[73.063px] h-9 font-medium text-white text-md rounded">Login</button>
            </div>
            <div class="hidden" id="errorAlert">
                <div role="alert" class="mt-1 mb-5  flex w-96 p-3 bg-red-500 rounded-md" id="alert">
                    <img src="cross.png" class="h-6 mt-1" alt="">
                    <p id="failedError" class="text-[#fff3b0] text-lg"></p>
                    <button
                        class="flex items-right ml-auto cursor-pointer transition-all px-2 h-8 rounded-md text-[#fff3b0] hover:bg-white/10 active:bg-white/10 justify-center top-1.5 right-1.5"
                        id="closeButton" type="button">
                        Close
                    </button>
                </div>
            </div>
            <div class="hidden" id="successAlert">
                <div role="alert" class="mt-1 mb-5 text-lg flex w-96 p-3 text-[#fff3b0] bg-green-500 rounded-md"
                    id="alert">
                    <img src="tick.png" class="h-8" alt="">
                    <p id="success" class="text-[#fff3b0] text-lg"></p>
                </div>
            </div>
        </form>
    </div>
    <script>
        document.querySelector("#loginForm").addEventListener("submit", (e) => {
            let errorCount = 0;
            e.preventDefault();

            document.querySelectorAll(".inputError").forEach(el => {
                el.classList.remove("inputError", "placeholder-red-500");
            });

            if (document.getElementById("email").value === "") {
                document.getElementById("email").classList.add('inputError', 'placeholder-red-500');
                errorCount++;
            }

            if (document.getElementById("password").value === "") {
                document.getElementById("password").classList.add('inputError', 'placeholder-red-500');
                errorCount++;
            }

            // Set focus to the first empty field
            if (document.getElementById("email").value === "") {
                document.getElementById("email").focus();
            }
            else if (document.getElementById("password").value === "") {
                document.getElementById("password").focus();
            }

            // Prevent form submission if there are errors
            if (errorCount > 0) {
            }
            else {

                const data = {
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                };

                document.getElementById("submitBtn").disabled = true;
                document.getElementById("submitBtn").innerText = "Please wait...";

                fetch('Login.php', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                    dataType: 'json',
                    data: data
                }).then(response => response.text())
                .then(result => {
                    const parsedResult = JSON.parse(result);
                    console.log(parsedResult.message);
                    if (parsedResult.status) {
                        document.getElementById("success").innerText = parsedResult.message;
                        document.getElementById("successAlert").className.replace("hidden", "block");
                    } else {
                        document.getElementById("failedError").innerText = parsedResult.message;
                        document.getElementById("errorAlert").className.remove = "hidden";
                        document.getElementById("errorAlert").className = "block";
                    }
                });
                setTimeout(() => {
                    // window.location.href = "Dashboard.html";
                    document.getElementById("submitBtn").disabled = false;
                    document.getElementById("submitBtn").innerText = "Login";
                }, 5000);
            }
        })
    </script>
</body>

</html>
